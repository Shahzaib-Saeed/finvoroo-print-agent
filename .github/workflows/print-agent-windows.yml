name: Print Agent Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'print-agent-v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Publish installer + updater manifest
        run: npm run publish-installer

      - name: Verify signed updater manifest
        if: startsWith(github.ref, 'refs/tags/print-agent-v')
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/print-agent-latest.json')) {
            Write-Error 'Missing dist/print-agent-latest.json — signing key or publish-installer failed.'
            exit 1
          }
          $manifest = Get-Content 'dist/print-agent-latest.json' -Raw | ConvertFrom-Json
          if (-not $manifest.platforms.'windows-x86_64'.signature) {
            Write-Error 'print-agent-latest.json has no windows-x86_64 signature.'
            exit 1
          }
          Write-Host "Updater manifest OK (v$($manifest.version))."

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FinvorooPrintAgent-Windows
          # dist/ holds the client-facing FinvorooPrintAgent-Setup.exe plus, when
          # signing secrets were present, its .sig and print-agent-latest.json —
          # everything needed for the manual upload to app.finvoroo.com/downloads/.
          path: |
            dist/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            dist/print-agent-latest.json

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/print-agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FinvorooPrintAgent-Setup.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            dist/print-agent-latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
