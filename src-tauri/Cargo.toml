[package]
name = "finvoroo-print-agent"
version = "1.1.7"
description = "Finvoroo Print Agent — silent Windows printing for Finvoroo ERP"
authors = ["Finvoroo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "finvoroo_print_agent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "limit"] }
http = "1"
anyhow = "1"
hex = "0.4"
getrandom = "0.2"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
crossbeam-channel = "0.5"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
image = { version = "0.25", default-features = false, features = ["png"] }
# Must stay on 0.61: webview2-com 0.38 is generated against windows ^0.61.
# Pairing it with windows 0.58 pulls two copies of windows_core / windows_strings
# and every WebView2 call (HSTRING, PCWSTR, Interface::cast, Error) fails to type-check.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
